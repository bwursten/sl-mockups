<section class="widget slot-S w-pinewood" data-widget="pinewood" data-slot="z3-2" aria-labelledby="w-pinewood-title"
         style="--tilt:0deg;--accent:var(--sunny)">
  <header class="widget-head">
    <span class="widget-icon" aria-hidden="true">🏁</span>
    <h2 class="widget-title" id="w-pinewood-title">Pinewood Derby</h2>
  </header>
  <div class="widget-body">
    <svg class="pw-sprite" aria-hidden="true" focusable="false" width="0" height="0">
      <symbol id="pw-car-hotdog" viewBox="0 0 48 24">
        <rect x="1.5" y="5" width="45" height="8" rx="4" fill="#FF5A1F" stroke="#12102B" stroke-width="2.2"/>
        <path d="M7 9q2.5-3 5 0t5 0 5 0 5 0 5 0 5 0 5 0" fill="none" stroke="#FFE600" stroke-width="2" stroke-linecap="round"/>
        <path d="M5 13.5Q5 9.5 10 10h28q5-.5 5 3.5 0 5-6 5.5H11q-6-.5-6-5.5z" fill="#C9D3E3" stroke="#12102B" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M10 14.5h24" stroke="rgba(18,16,43,.25)" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="13" cy="19.5" r="4" fill="#12102B"/><circle cx="13" cy="19.5" r="1.4" fill="#fff"/>
        <circle cx="36" cy="19.5" r="4" fill="#12102B"/><circle cx="36" cy="19.5" r="1.4" fill="#fff"/>
      </symbol>
      <symbol id="pw-car-rocket" viewBox="0 0 48 24">
        <circle cx="3" cy="12" r="2.4" fill="#fff" stroke="#12102B" stroke-width="1.2"/>
        <circle cx="1.6" cy="16" r="1.6" fill="#fff" stroke="#12102B" stroke-width="1.1"/>
        <path d="M9 9 6 2.5h6.5L17 9z" fill="#FF5A1F" stroke="#12102B" stroke-width="2" stroke-linejoin="round"/>
        <path d="M6 8h28q12 2 12 6.5T34 20H6z" fill="#3D5AFE" stroke="#12102B" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M37 9q6 2 8.5 5.5" fill="none" stroke="#FFE600" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="26" cy="13" r="3.4" fill="#5CC8FF" stroke="#12102B" stroke-width="1.8"/>
        <path d="M6 14h12" stroke="#FFE600" stroke-width="2" stroke-linecap="round"/>
        <circle cx="13" cy="19.5" r="4" fill="#12102B"/><circle cx="13" cy="19.5" r="1.4" fill="#fff"/>
        <circle cx="36" cy="19.5" r="4" fill="#12102B"/><circle cx="36" cy="19.5" r="1.4" fill="#fff"/>
      </symbol>
      <symbol id="pw-car-shark" viewBox="0 0 48 24">
        <path d="M6 12 1 6l2 7.5L1 19.5z" fill="#00E5FF" stroke="#12102B" stroke-width="2" stroke-linejoin="round"/>
        <path d="M19 8.5 25 1l4 7.5z" fill="#00E5FF" stroke="#12102B" stroke-width="2" stroke-linejoin="round"/>
        <path d="M5 13q4-5.5 22-5.5 15 0 19 7.5-3 5-15 5H9q-4-1-4-7z" fill="#00E5FF" stroke="#12102B" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M14 16.5q12 2 30-1.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="37" cy="11.5" r="1.7" fill="#12102B"/>
        <path d="M39 15q2.5 1.5 4.5-.5" fill="none" stroke="#12102B" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M30 10.5v4M32.5 10.5v4" stroke="#00879A" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="13" cy="19.5" r="4" fill="#12102B"/><circle cx="13" cy="19.5" r="1.4" fill="#fff"/>
        <circle cx="36" cy="19.5" r="4" fill="#12102B"/><circle cx="36" cy="19.5" r="1.4" fill="#fff"/>
      </symbol>
    </svg>

    <div class="pw-trackwrap">
      <svg class="pw-track" viewBox="0 0 320 132" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A sloped three-lane derby track with a checkered finish line">
        <defs>
          <pattern id="pw-check" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="#fff"/><rect width="4" height="4" fill="#12102B"/><rect x="4" y="4" width="4" height="4" fill="#12102B"/>
          </pattern>
        </defs>
        <!-- supports + floor -->
        <g class="pw-legs"><rect x="28" y="56" width="7" height="72"/><rect x="74" y="78" width="7" height="50"/><rect x="200" y="124" width="7" height="6"/></g>
        <path class="pw-floor" d="M4 129.5h312"/>
        <!-- track surface -->
        <path class="pw-surface" d="M10 18 L118 66 Q132 72 150 72 L314 72 L314 128 L150 128 Q126 128 112 122 L10 76 Z"/>
        <!-- lane lines (cars ride on these) -->
        <path class="pw-lane" data-lane="0" d="M12 37 L116 84 Q130 90 150 90 L312 90" fill="none"/>
        <path class="pw-lane" data-lane="1" d="M12 56 L114 102 Q128 108 150 108 L312 108" fill="none"/>
        <path class="pw-lane" data-lane="2" d="M12 75 L112 120 Q124 126 150 126 L312 126" fill="none"/>
        <!-- lane lights along the flat -->
        <g class="pw-leds"><rect x="160" y="74.5" width="3" height="3"/><rect x="184" y="74.5" width="3" height="3"/><rect x="208" y="74.5" width="3" height="3"/><rect x="232" y="74.5" width="3" height="3"/><rect x="256" y="74.5" width="3" height="3"/></g>
        <!-- start peg + finish -->
        <rect class="pw-peg" x="24" y="14" width="5" height="64" rx="1" transform="rotate(-24 26 46)"/>
        <rect class="pw-finish" x="276" y="72" width="16" height="56" fill="url(#pw-check)" stroke="#05040F" stroke-width="2"/>
        <path class="pw-pole" d="M296 72V30"/>
        <path d="M297 31h20v14h-20z" fill="url(#pw-check)" stroke="#05040F" stroke-width="2"/>
        <text class="pw-svgtxt" x="6" y="10">START</text>
        <text class="pw-svgtxt pw-fin-txt" x="234" y="26">FINISH</text>
        <!-- start lights + countdown -->
        <g class="pw-lights" data-n="0" aria-hidden="true">
          <rect class="pw-lights-box" x="140" y="6" width="54" height="20" rx="3"/>
          <circle class="pw-light l1" cx="153" cy="16" r="5"/><circle class="pw-light l2" cx="167" cy="16" r="5"/><circle class="pw-light l3" cx="181" cy="16" r="5"/>
        </g>
        <text class="pw-vroom pw-count" x="167" y="52" text-anchor="middle">READY?</text>
        <!-- cars -->
        <g class="pw-car" data-car="hotdog" transform="translate(34 37) rotate(24.3)">
          <use href="#pw-car-hotdog" x="-22" y="-21" width="44" height="22"/>
          <g class="pw-you" transform="translate(0 -26)"><path d="M-12 -10h24v10h-8l-4 5-4-5h-8z"/><text x="0" y="-2.6" text-anchor="middle">YOU</text></g>
        </g>
        <g class="pw-car" data-car="rocket" transform="translate(34 56) rotate(24.3)">
          <use href="#pw-car-rocket" x="-22" y="-21" width="44" height="22"/>
          <g class="pw-you" transform="translate(0 -26)"><path d="M-12 -10h24v10h-8l-4 5-4-5h-8z"/><text x="0" y="-2.6" text-anchor="middle">YOU</text></g>
        </g>
        <g class="pw-car" data-car="shark" transform="translate(34 75) rotate(24.3)">
          <use href="#pw-car-shark" x="-22" y="-21" width="44" height="22"/>
          <g class="pw-you" transform="translate(0 -26)"><path d="M-12 -10h24v10h-8l-4 5-4-5h-8z"/><text x="0" y="-2.6" text-anchor="middle">YOU</text></g>
        </g>
      </svg>
      <div class="pw-place" hidden><div class="pw-place-txt"><span class="pw-place-s">You got</span><span class="pw-place-n">1st</span></div><div class="pw-pod" aria-hidden="true"></div></div>
    </div>

    <div class="pw-pick" role="group" aria-label="Pick your car">
      <button type="button" class="pw-pickbtn" data-car="hotdog" aria-pressed="false">
        <svg viewBox="0 0 48 24" aria-hidden="true" focusable="false"><use href="#pw-car-hotdog"/></svg><span>Hot Dog</span>
      </button>
      <button type="button" class="pw-pickbtn" data-car="rocket" aria-pressed="false">
        <svg viewBox="0 0 48 24" aria-hidden="true" focusable="false"><use href="#pw-car-rocket"/></svg><span>Rocket</span>
      </button>
      <button type="button" class="pw-pickbtn" data-car="shark" aria-pressed="false">
        <svg viewBox="0 0 48 24" aria-hidden="true" focusable="false"><use href="#pw-car-shark"/></svg><span>Shark Fin</span>
      </button>
    </div>

    <div class="pw-go">
      <button type="button" class="btn btn-teal pw-race">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4 18V2" stroke="#12102B" stroke-width="2.4" stroke-linecap="square"/><path d="M5 3h12v9H5z" fill="url(#pw-check)" stroke="#12102B" stroke-width="1.8"/></svg>
        <span class="pw-race-label">Race!</span>
      </button>
      <p class="pw-result" aria-live="polite">Pick your car, then hit Race!</p>
    </div>

    <div class="pw-links">
      <a class="pw-link" href="https://scoutlife.org/hobbies-projects/projects/2952/fast-pinewood-derby-car/"><img src="assets/img/pinewood-fastcar.jpg" alt="" width="300" height="200" loading="lazy">Fast-car tips</a>
      <a class="pw-link" href="https://scoutlife.org/hobbies-projects/pinewood-derby/188756/rev-up-your-imagination-with-these-awesome-pinewood-derby-cars-of-2026/"><img src="assets/img/pinewood-halloffame.jpg" alt="" width="300" height="200" loading="lazy">2026 Hall of Fame</a>
    </div>
  </div>
  <footer class="widget-foot">
    <a class="more-link" href="https://scoutlife.org/pinewood-derby/">Pinewood Derby HQ</a>
  </footer>
</section>
