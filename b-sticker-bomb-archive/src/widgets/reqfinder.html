<section class="widget slot-W w-reqfinder" data-widget="reqfinder" data-slot="z1-4" aria-labelledby="w-reqfinder-title"
         style="--tilt:.6deg;--accent:var(--teal);--tape:rgba(255,200,61,.75);--tape-tilt:-3deg">
  <header class="widget-head">
    <span class="widget-icon" aria-hidden="true">🧭</span>
    <h2 class="widget-title" id="w-reqfinder-title">Requirements Finder</h2>
    <span class="widget-kicker rf-kick" aria-hidden="true">
      <span class="rf-trail"><span class="rf-trail-fill"></span><span class="rf-boot">🥾</span><span class="rf-camp">⛺</span></span>
    </span>
  </header>
  <div class="widget-body rf-body">
    <form class="rf-form" action="https://scoutlife.org/" method="get" role="search" aria-label="Find Scout Life articles for a rank or requirement">
      <div class="rf-steps">
        <fieldset class="rf-step rf-s1 is-on">
          <legend class="rf-lbl"><span class="rf-num" aria-hidden="true">1</span>I’m in…</legend>
          <div class="rf-progs">
            <label class="rf-prog"><input type="radio" name="program" value="cub"><span class="rf-pbtn"><span class="rf-pe" aria-hidden="true">🐾</span><span>Cub Scouts</span></span></label>
            <label class="rf-prog"><input type="radio" name="program" value="bsa"><span class="rf-pbtn"><span class="rf-pe" aria-hidden="true">⚜️</span><span>Scouts BSA</span></span></label>
          </div>
        </fieldset>
        <div class="rf-step rf-s2">
          <label class="rf-lbl" for="rf-rank"><span class="rf-num" aria-hidden="true">2</span>Rank</label>
          <select class="rf-sel" id="rf-rank">
            <option value="">Choose a rank…</option>
            <optgroup label="Cub Scouts">
              <option value="lion">Lion</option>
              <option value="tiger">Tiger</option>
              <option value="wolf">Wolf</option>
              <option value="bear">Bear</option>
              <option value="webelos">Webelos</option>
              <option value="aol">Arrow of Light</option>
            </optgroup>
            <optgroup label="Scouts BSA">
              <option value="scout">Scout</option>
              <option value="tenderfoot">Tenderfoot</option>
              <option value="second">Second Class</option>
              <option value="first">First Class</option>
              <option value="star">Star</option>
              <option value="life">Life</option>
              <option value="eagle">Eagle</option>
              <option value="mb">Merit Badges</option>
            </optgroup>
          </select>
        </div>
        <div class="rf-step rf-s3">
          <label class="rf-lbl" for="rf-req"><span class="rf-num" aria-hidden="true">3</span><span class="rf-l3">Adventure or requirement</span></label>
          <select class="rf-sel" id="rf-req" name="s">
            <option value="">Choose one…</option>
            <optgroup label="Cub Scouts · Lion">
              <option value="cub scout six essentials">Mountain Lion (outdoor essentials)</option>
              <option value="fitness">Fun on the Run (get moving)</option>
              <option value="garden">Ready, Set, Grow (gardening)</option>
              <option value="pinewood derby">Race Time (Pinewood Derby)</option>
            </optgroup>
            <optgroup label="Cub Scouts · Tiger">
              <option value="hiking">Tigers in the Wild (hiking)</option>
              <option value="magic trick">Curiosity, Intrigue &amp; Magical Mysteries</option>
              <option value="healthy snacks">Tiger Bites (healthy snacks)</option>
              <option value="pinewood derby">Race Time (Pinewood Derby)</option>
            </optgroup>
            <optgroup label="Cub Scouts · Wolf">
              <option value="hiking">Paws on the Path (hiking)</option>
              <option value="secret codes">Code of the Wolf (codes &amp; secret messages)</option>
              <option value="compass">Finding Your Way (maps &amp; compass)</option>
              <option value="water safety">Spirit of the Water (water safety)</option>
              <option value="fishing">A Wolf Goes Fishing</option>
            </optgroup>
            <optgroup label="Cub Scouts · Bear">
              <option value="camping">Bear Necessities (camping)</option>
              <option value="whittling">Whittling (pocketknife safety)</option>
              <option value="animals and nature">Bear Habitat (nature)</option>
              <option value="jokes">Roaring Laughter (jokes!)</option>
              <option value="bike">Pedal Power (bikes)</option>
            </optgroup>
            <optgroup label="Cub Scouts · Webelos">
              <option value="hiking">Webelos Walkabout (hiking)</option>
              <option value="fishing">Catch the Big One (fishing)</option>
              <option value="swimming">Aquanaut (swimming)</option>
              <option value="animals and nature">Into the Wild (nature)</option>
              <option value="art projects">Art Explosion</option>
            </optgroup>
            <optgroup label="Cub Scouts · Arrow of Light">
              <option value="camping">Outdoor Adventurer (camping)</option>
              <option value="fitness">Personal Fitness</option>
              <option value="pocketknife">Knife Safety</option>
              <option value="fishing">Fishing</option>
            </optgroup>
            <optgroup label="Scouts BSA · Scout">
              <option value="scout law">Scout Oath &amp; Law (req. 1)</option>
              <option value="scout sign">Scout sign, salute &amp; handshake (req. 1)</option>
              <option value="square knot">Square knot &amp; whipping rope (req. 4)</option>
              <option value="pocketknife safety">Pocketknife safety (req. 5)</option>
            </optgroup>
            <optgroup label="Scouts BSA · Tenderfoot">
              <option value="camping gear">Camping gear &amp; setup (req. 1)</option>
              <option value="camp cooking">Camp cooking (req. 2)</option>
              <option value="knots">Two half-hitches &amp; taut-line hitch (req. 3)</option>
              <option value="first aid">First aid &amp; bug bites (req. 4)</option>
              <option value="fitness">Fitness (req. 6)</option>
              <option value="flag">Flag &amp; citizenship (req. 7)</option>
            </optgroup>
            <optgroup label="Scouts BSA · Second Class">
              <option value="campfire">Campfire safety &amp; fire building (req. 2)</option>
              <option value="map and compass">Map &amp; compass (req. 3)</option>
              <option value="animals and nature">Wildlife ID (req. 4)</option>
              <option value="swimming">Swimming &amp; water safety (req. 5)</option>
              <option value="first aid">First aid (req. 6)</option>
            </optgroup>
            <optgroup label="Scouts BSA · First Class">
              <option value="camp cooking">Cooking a patrol meal (req. 2)</option>
              <option value="lashing">Lashings &amp; pioneering (req. 3)</option>
              <option value="orienteering">Orienteering &amp; navigation (req. 4)</option>
              <option value="animals and nature">Native plants &amp; animals (req. 5)</option>
              <option value="first aid kit">First aid &amp; emergency kit (req. 7)</option>
            </optgroup>
            <optgroup label="Scouts BSA · Star">
              <option value="service project">Service hours (req. 4)</option>
              <option value="den chief">Position of responsibility (req. 5)</option>
            </optgroup>
            <optgroup label="Scouts BSA · Life">
              <option value="service project">Service project (req. 4)</option>
              <option value="teach scout skills">Teach a younger Scout (req. 6)</option>
            </optgroup>
            <optgroup label="Scouts BSA · Eagle">
              <option value="eagle project">Eagle Scout service project (req. 5)</option>
              <option value="eagle scout">Eagle Scouts in action</option>
              <option value="eagle board of review">Board of review (req. 7)</option>
            </optgroup>
            <optgroup label="Scouts BSA · Merit Badges">
              <option value="astronomy">Astronomy</option>
              <option value="citizenship">Citizenship in the Nation</option>
              <option value="camp cooking">Cooking</option>
              <option value="first aid">First Aid</option>
              <option value="fishing">Fishing</option>
              <option value="multisport">Multisport</option>
              <option value="orienteering">Orienteering</option>
              <option value="pioneering">Pioneering</option>
              <option value="snakes">Reptile &amp; Amphibian Study</option>
              <option value="morse code">Signs, Signals &amp; Codes</option>
              <option value="space exploration">Space Exploration</option>
              <option value="wilderness survival">Wilderness Survival</option>
            </optgroup>
          </select>
        </div>
        <button class="btn btn-sm btn-teal rf-go" type="submit">Find it!</button>
      </div>
    </form>

    <div class="rf-board">
      <div class="rf-empty">
        <p class="rf-empty-t"><span class="rf-arrow" aria-hidden="true">↖</span> <span class="rf-empty-msg">Pick your program, rank and requirement. We’ll pin matching Scout Life stories right here!</span></p>
        <p class="rf-pop"><span class="rf-pop-l">Popular:</span>
          <a class="rf-chip" href="https://scoutlife.org/about-scouts/182075/memorize-the-scout-law/">Memorize the Scout Law</a>
          <a class="rf-chip" href="https://scoutlife.org/about-scouts/scouting-around/191944/use-the-compass-game-to-improve-your-navigation-skills/">Compass Game</a>
          <a class="rf-chip" href="https://scoutlife.org/outdoors/176401/how-to-tie-the-7-basic-scout-knots/">7 Basic Scout Knots</a>
          <a class="rf-chip" href="https://scoutlife.org/hobbies-projects/projects/2952/fast-pinewood-derby-car/">Fast Pinewood Derby Car</a>
        </p>
      </div>
    </div>
    <p class="sr-only rf-status" aria-live="polite"></p>
  </div>
  <footer class="widget-foot">
    <a class="more-link" href="https://scoutlife.org/section/about-scouts/">More Scouting stuff</a>
    <span class="rf-foot-doodle" aria-hidden="true">for Scouts, parents &amp; leaders ✓</span>
  </footer>
</section>
