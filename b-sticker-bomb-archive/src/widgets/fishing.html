<section class="widget slot-S w-fishing" data-widget="fishing" data-slot="z3-3" aria-labelledby="w-fishing-title"
         style="--tilt:-1.2deg;--accent:var(--sky);--tape:rgba(255,200,61,.75);--tape-tilt:-5deg">
  <header class="widget-head">
    <span class="widget-icon" aria-hidden="true">🎣</span>
    <h2 class="widget-title" id="w-fishing-title">Cast a Line</h2>
    <span class="widget-kicker">bite?</span>
  </header>

  <div class="widget-body fs-body">
    <div class="fs-scene">
      <svg class="fs-svg" viewBox="0 0 360 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
        <rect class="fs-sky" width="360" height="260"/>
        <g class="fs-sun"><circle cx="304" cy="42" r="20"/><path d="M304 10v-8M304 74v8M272 42h-8M336 42h8M281 19l-6-6M327 65l6 6M327 19l6-6M281 65l-6 6"/></g>
        <path class="fs-cloud" d="M54 50c-10 0-14-12-4-16 0-10 14-12 18-4 6-8 22-4 20 6 10 0 10 14 0 14z"/>
        <path class="fs-cloud" d="M170 32c-7 0-10-8-3-11 0-7 10-8 13-3 4-6 15-3 14 4 7 0 7 10 0 10z"/>
        <path class="fs-hill" d="M0 134 Q50 92 110 124 Q170 88 240 122 Q300 98 360 120 V140 H0 Z"/>
        <g class="fs-pines"><path d="M196 112l8-22 8 22z"/><path d="M210 114l7-18 7 18z"/><path d="M84 116l7-20 7 20z"/><path d="M322 112l6-17 6 17z"/></g>
        <rect class="fs-water" x="-10" y="130" width="380" height="140"/>
        <path class="fs-waterline" d="M-10 130H370"/>
        <g class="fs-waves">
          <path d="M150 160q8-6 16 0t16 0"/><path d="M250 196q8-6 16 0t16 0"/><path d="M300 150q6-5 12 0t12 0"/>
          <path d="M190 232q8-6 16 0t16 0"/><path d="M120 248q6-5 12 0t12 0"/><path d="M220 140q6-5 12 0t12 0"/>
        </g>
        <g class="fs-pad"><ellipse cx="322" cy="214" rx="20" ry="7"/><path d="M322 214l14-5"/></g>
        <g class="fs-cattails">
          <path class="fs-reed" d="M340 260V150M350 260V162M332 260V170"/>
          <rect x="336" y="150" width="8" height="24" rx="4"/><rect x="346" y="162" width="8" height="22" rx="4"/>
        </g>
        <g class="fs-dock">
          <path class="fs-post" d="M18 220v40M100 220v40"/>
          <path class="fs-deck" d="M-10 202H118L126 224H-10Z"/>
          <path class="fs-planks" d="M22 202l2 22M50 202l2 22M78 202l2 22M104 202l3 22"/>
          <rect class="fs-holder" x="38" y="188" width="14" height="22" rx="3"/>
        </g>
        <g class="fs-ripples"><ellipse cx="0" cy="0" rx="10" ry="3"/><ellipse cx="0" cy="0" rx="10" ry="3"/></g>
        <path class="fs-line" d="M156 81L156 112"/>
        <g class="fs-bobber" transform="translate(156 112)"><g class="fs-bob-in">
          <path class="fs-bob-stick" d="M0 -12V-6"/>
          <path class="fs-bob-top" d="M-7 0a7 7 0 0 1 14 0z"/><path class="fs-bob-bot" d="M-7 0a7 7 0 0 0 14 0z"/>
        </g></g>
        <g class="fs-rod" transform="rotate(-48 45 204)">
          <path class="fs-rod-pole" d="M45 204H210"/>
          <path class="fs-rod-tip" d="M150 204H210"/>
          <rect class="fs-rod-grip" x="30" y="199" width="34" height="10" rx="5"/>
          <circle class="fs-reel" cx="72" cy="213" r="8"/>
          <path class="fs-rod-guides" d="M110 204v4M160 204v3M196 204v3"/>
        </g>
      </svg>

      <!-- jumping-fish critter (egg) -->
      <button type="button" class="fs-ripple-btn" aria-label="Ripples in the pond… something’s jumping!"><span class="fs-ring"></span><span class="fs-ring"></span></button>
      <div class="fs-layer" aria-hidden="true"></div>
      <p class="fs-tally" aria-live="polite" hidden></p>

      <!-- the catch (static fallback before JS) -->
      <a class="fs-card fs-static" href="https://fishing.scoutlife.org/8-fishing-knots-to-know/">
        <img src="assets/img/fishing-knots.jpg" alt="" width="400" height="225" loading="lazy">
        <span class="fs-card-txt"><span class="fs-card-kick">Today’s catch:</span><span class="fs-card-t">8 Fishing Knots to Know</span></span>
      </a>
    </div>

    <div class="fs-controls">
      <button type="button" class="btn btn-sky fs-go" aria-describedby="fs-status">🎣 Cast!</button>
      <p class="fs-status" id="fs-status" aria-live="polite">Tap Cast! and see what you reel in.</p>
    </div>
  </div>

  <footer class="widget-foot">
    <a class="more-link" href="https://fishing.scoutlife.org/">More fishing</a>
    <span class="fs-foot-doodle" aria-hidden="true">~ &gt;&lt;(((°&gt; ~</span>
  </footer>
</section>
