<section class="widget slot-S w-pinewood" data-widget="pinewood" data-slot="z3-2" aria-labelledby="w-pinewood-title"
         style="--tilt:-1.3deg;--accent:var(--sunny);--tape:rgba(18,181,165,.6);--tape-tilt:-5deg">
  <header class="widget-head">
    <span class="widget-icon" aria-hidden="true">🏁</span>
    <h2 class="widget-title" id="w-pinewood-title">Pinewood Derby</h2>
  </header>
  <div class="widget-body">
    <svg class="pw-sprite" aria-hidden="true" focusable="false" width="0" height="0">
      <symbol id="pw-car-hotdog" viewBox="0 0 48 24">
        <rect x="1.5" y="5" width="45" height="8" rx="4" fill="#FF5A36" stroke="#1E1E2A" stroke-width="2.2"/>
        <path d="M7 9q2.5-3 5 0t5 0 5 0 5 0 5 0 5 0 5 0" fill="none" stroke="#FFC83D" stroke-width="2" stroke-linecap="round"/>
        <path d="M5 13.5Q5 9.5 10 10h28q5-.5 5 3.5 0 5-6 5.5H11q-6-.5-6-5.5z" fill="#E8D2A6" stroke="#1E1E2A" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M10 14.5h24" stroke="rgba(30,30,42,.25)" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="13" cy="19.5" r="4" fill="#1E1E2A"/><circle cx="13" cy="19.5" r="1.4" fill="#fff"/>
        <circle cx="36" cy="19.5" r="4" fill="#1E1E2A"/><circle cx="36" cy="19.5" r="1.4" fill="#fff"/>
      </symbol>
      <symbol id="pw-car-rocket" viewBox="0 0 48 24">
        <circle cx="3" cy="12" r="2.4" fill="#fff" stroke="#1E1E2A" stroke-width="1.2"/>
        <circle cx="1.6" cy="16" r="1.6" fill="#fff" stroke="#1E1E2A" stroke-width="1.1"/>
        <path d="M9 9 6 2.5h6.5L17 9z" fill="#FF5A36" stroke="#1E1E2A" stroke-width="2" stroke-linejoin="round"/>
        <path d="M6 8h28q12 2 12 6.5T34 20H6z" fill="#2D6BEA" stroke="#1E1E2A" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M37 9q6 2 8.5 5.5" fill="none" stroke="#FFC83D" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="26" cy="13" r="3.4" fill="#6CC8F0" stroke="#1E1E2A" stroke-width="1.8"/>
        <path d="M6 14h12" stroke="#FFC83D" stroke-width="2" stroke-linecap="round"/>
        <circle cx="13" cy="19.5" r="4" fill="#1E1E2A"/><circle cx="13" cy="19.5" r="1.4" fill="#fff"/>
        <circle cx="36" cy="19.5" r="4" fill="#1E1E2A"/><circle cx="36" cy="19.5" r="1.4" fill="#fff"/>
      </symbol>
      <symbol id="pw-car-shark" viewBox="0 0 48 24">
        <path d="M6 12 1 6l2 7.5L1 19.5z" fill="#12B5A5" stroke="#1E1E2A" stroke-width="2" stroke-linejoin="round"/>
        <path d="M19 8.5 25 1l4 7.5z" fill="#12B5A5" stroke="#1E1E2A" stroke-width="2" stroke-linejoin="round"/>
        <path d="M5 13q4-5.5 22-5.5 15 0 19 7.5-3 5-15 5H9q-4-1-4-7z" fill="#12B5A5" stroke="#1E1E2A" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M14 16.5q12 2 30-1.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="37" cy="11.5" r="1.7" fill="#1E1E2A"/>
        <path d="M39 15q2.5 1.5 4.5-.5" fill="none" stroke="#1E1E2A" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M30 10.5v4M32.5 10.5v4" stroke="#0B7D72" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="13" cy="19.5" r="4" fill="#1E1E2A"/><circle cx="13" cy="19.5" r="1.4" fill="#fff"/>
        <circle cx="36" cy="19.5" r="4" fill="#1E1E2A"/><circle cx="36" cy="19.5" r="1.4" fill="#fff"/>
      </symbol>
    </svg>

    <div class="pw-trackwrap">
      <svg class="pw-track" viewBox="0 0 320 132" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A sloped three-lane derby track with a checkered finish line">
        <defs>
          <pattern id="pw-check" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="#fff"/><rect width="4" height="4" fill="#1E1E2A"/><rect x="4" y="4" width="4" height="4" fill="#1E1E2A"/>
          </pattern>
        </defs>
        <!-- supports -->
        <g stroke="#1E1E2A" stroke-width="2.5" fill="#4A4A5C">
          <rect x="28" y="56" width="7" height="72"/><rect x="74" y="78" width="7" height="50"/><rect x="200" y="124" width="7" height="6"/>
        </g>
        <path d="M4 129h312" stroke="#1E1E2A" stroke-width="2.5" stroke-linecap="round"/>
        <!-- track surface -->
        <path class="pw-surface" d="M10 18 L118 66 Q132 72 150 72 L314 72 L314 128 L150 128 Q126 128 112 122 L10 76 Z" fill="#E8D2A6" stroke="#1E1E2A" stroke-width="3" stroke-linejoin="round"/>
        <!-- lane lines (cars ride on these) -->
        <path class="pw-lane" data-lane="0" d="M12 37 L116 84 Q130 90 150 90 L312 90" fill="none" stroke="rgba(30,30,42,.35)" stroke-width="2"/>
        <path class="pw-lane" data-lane="1" d="M12 56 L114 102 Q128 108 150 108 L312 108" fill="none" stroke="rgba(30,30,42,.35)" stroke-width="2"/>
        <path class="pw-lane" data-lane="2" d="M12 75 L112 120 Q124 126 150 126 L312 126" fill="none" stroke="rgba(30,30,42,.0)" stroke-width="2"/>
        <!-- start peg + finish -->
        <rect x="24" y="14" width="5" height="64" rx="2" fill="#FF5A36" stroke="#1E1E2A" stroke-width="2" transform="rotate(-24 26 46)"/>
        <rect class="pw-finish" x="276" y="72" width="16" height="56" fill="url(#pw-check)" stroke="#1E1E2A" stroke-width="2.5"/>
        <path d="M296 72V30" stroke="#1E1E2A" stroke-width="3" stroke-linecap="round"/>
        <path d="M297 31h20v14h-20z" fill="url(#pw-check)" stroke="#1E1E2A" stroke-width="2"/>
        <text x="6" y="11" font-family="'Gochi Hand',cursive" font-size="13" fill="#1E1E2A">START</text>
        <text x="236" y="40" font-family="'Gochi Hand',cursive" font-size="13" fill="#1E1E2A" transform="rotate(-6 255 36)">FINISH →</text>
        <text class="pw-vroom" x="150" y="30" font-family="'Gochi Hand',cursive" font-size="16" fill="#D93A17" transform="rotate(-8 170 26)">vroom!</text>
        <!-- cars -->
        <g class="pw-car" data-car="hotdog" transform="translate(34 37) rotate(24.3)">
          <use href="#pw-car-hotdog" x="-22" y="-21" width="44" height="22"/>
          <g class="pw-you" transform="translate(0 -26)"><path d="M-11 -10h22v10h-7l-4 5-4-5h-7z" fill="#FFC83D" stroke="#1E1E2A" stroke-width="1.8" stroke-linejoin="round"/><text x="0" y="-2" text-anchor="middle" font-family="'Patua One',serif" font-size="8.5" fill="#1E1E2A">YOU</text></g>
        </g>
        <g class="pw-car" data-car="rocket" transform="translate(34 56) rotate(24.3)">
          <use href="#pw-car-rocket" x="-22" y="-21" width="44" height="22"/>
          <g class="pw-you" transform="translate(0 -26)"><path d="M-11 -10h22v10h-7l-4 5-4-5h-7z" fill="#FFC83D" stroke="#1E1E2A" stroke-width="1.8" stroke-linejoin="round"/><text x="0" y="-2" text-anchor="middle" font-family="'Patua One',serif" font-size="8.5" fill="#1E1E2A">YOU</text></g>
        </g>
        <g class="pw-car" data-car="shark" transform="translate(34 75) rotate(24.3)">
          <use href="#pw-car-shark" x="-22" y="-21" width="44" height="22"/>
          <g class="pw-you" transform="translate(0 -26)"><path d="M-11 -10h22v10h-7l-4 5-4-5h-7z" fill="#FFC83D" stroke="#1E1E2A" stroke-width="1.8" stroke-linejoin="round"/><text x="0" y="-2" text-anchor="middle" font-family="'Patua One',serif" font-size="8.5" fill="#1E1E2A">YOU</text></g>
        </g>
      </svg>
      <div class="pw-place" hidden><span class="pw-place-n">1st</span><span class="pw-place-s">place!</span></div>
    </div>

    <div class="pw-pick" role="group" aria-label="Pick your car">
      <button type="button" class="pw-pickbtn" data-car="hotdog" aria-pressed="false">
        <svg viewBox="0 0 48 24" aria-hidden="true" focusable="false"><use href="#pw-car-hotdog"/></svg><span>Hot Dog</span>
      </button>
      <button type="button" class="pw-pickbtn" data-car="rocket" aria-pressed="false">
        <svg viewBox="0 0 48 24" aria-hidden="true" focusable="false"><use href="#pw-car-rocket"/></svg><span>Rocket</span>
      </button>
      <button type="button" class="pw-pickbtn" data-car="shark" aria-pressed="false">
        <svg viewBox="0 0 48 24" aria-hidden="true" focusable="false"><use href="#pw-car-shark"/></svg><span>Shark Fin</span>
      </button>
    </div>

    <div class="pw-go">
      <button type="button" class="btn btn-teal pw-race">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4 18V2" stroke="#1E1E2A" stroke-width="2.4" stroke-linecap="round"/><path d="M5 3h12v9H5z" fill="url(#pw-check)" stroke="#1E1E2A" stroke-width="1.8"/></svg>
        <span class="pw-race-label">Race!</span>
      </button>
      <p class="pw-result" aria-live="polite">Pick your car, then hit Race!</p>
    </div>

    <div class="pw-links">
      <a class="pw-link" href="https://scoutlife.org/hobbies-projects/projects/2952/fast-pinewood-derby-car/"><img src="assets/img/pinewood-fastcar.jpg" alt="" width="300" height="200" loading="lazy">Fast-car tips</a>
      <a class="pw-link" href="https://scoutlife.org/hobbies-projects/pinewood-derby/188756/rev-up-your-imagination-with-these-awesome-pinewood-derby-cars-of-2026/"><img src="assets/img/pinewood-halloffame.jpg" alt="" width="300" height="200" loading="lazy">2026 Hall of Fame</a>
    </div>
  </div>
  <footer class="widget-foot">
    <a class="more-link" href="https://scoutlife.org/pinewood-derby/">Pinewood Derby HQ</a>
  </footer>
</section>
