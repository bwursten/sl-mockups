<section class="widget slot-S w-poll" data-widget="poll" data-slot="z1-5" aria-labelledby="w-poll-title"
         style="--tilt:0deg;--accent:var(--orange);--pin:var(--forest)">
  <header class="widget-head">
    <span class="widget-icon" aria-hidden="true">📊</span>
    <h2 class="widget-title" id="w-poll-title">Today’s Poll</h2>
    <span class="widget-kicker">vote!</span>
  </header>
  <div class="widget-body pl-body">
    <form class="pl-form" action="https://scoutlife.org/polls/" method="get">
      <fieldset class="pl-set">
        <legend class="pl-q" id="pl-q">What’s the best campfire snack?</legend>
        <div class="pl-opts">
          <span class="pl-plaque" aria-hidden="true">Campfire Register</span>
          <button class="pl-opt" type="submit" name="vote" value="smores" style="--c:var(--sunny)">
            <span class="pl-track" aria-hidden="true"><span class="pl-bar"></span></span>
            <span class="pl-emoji" aria-hidden="true">🍫</span>
            <span class="pl-label">S’mores</span>
            <span class="pl-pct" aria-hidden="true"></span>
          </button>
          <button class="pl-opt" type="submit" name="vote" value="hotdogs" style="--c:var(--tomato)">
            <span class="pl-track" aria-hidden="true"><span class="pl-bar"></span></span>
            <span class="pl-emoji" aria-hidden="true">🌭</span>
            <span class="pl-label">Hot dogs on a stick</span>
            <span class="pl-pct" aria-hidden="true"></span>
          </button>
          <button class="pl-opt" type="submit" name="vote" value="bananaboats" style="--c:var(--lime)">
            <span class="pl-track" aria-hidden="true"><span class="pl-bar"></span></span>
            <span class="pl-emoji" aria-hidden="true">🍌</span>
            <span class="pl-label">Banana boats</span>
            <span class="pl-pct" aria-hidden="true"></span>
          </button>
          <button class="pl-opt" type="submit" name="vote" value="popcorn" style="--c:var(--sky)">
            <span class="pl-track" aria-hidden="true"><span class="pl-bar"></span></span>
            <span class="pl-emoji" aria-hidden="true">🍿</span>
            <span class="pl-label">Campfire popcorn</span>
            <span class="pl-pct" aria-hidden="true"></span>
          </button>
        </div>
      </fieldset>
    </form>
    <p class="pl-meta" aria-live="polite">Tap your pick! One vote per Scout.</p>
  </div>
  <footer class="widget-foot">
    <a class="more-link" href="https://scoutlife.org/polls/">More polls</a>
    <span class="pl-doodle" aria-hidden="true"><svg viewBox="0 0 44 22" width="44" height="22" focusable="false"><path d="M2 20 30 8" stroke="#7A4E2D" stroke-width="2.4" stroke-linecap="round"/><rect x="28" y="2" width="13" height="11" rx="4" transform="rotate(-22 34 8)" fill="#FFFDF6" stroke="#4B5A4E" stroke-width="1.8"/><path d="M31 11.5q3 1.2 7-1" fill="none" stroke="#B9480C" stroke-width="1.6" stroke-linecap="round"/></svg>yum!</span>
  </footer>
</section>
